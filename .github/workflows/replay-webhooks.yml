name: Replay failed webhooks

# Re-enqueues webhook deliveries that exhausted their retries (or got stuck
# because the broker was down) once receivers have had time to recover.
# Deliveries keep their Idempotency-Key, so receivers can dedupe safely.

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      since_hours:
        description: Only replay deliveries created in the last N hours
        default: "72"
      dry_run:
        description: List what would be replayed without enqueueing
        type: boolean
        default: false

concurrency:
  group: replay-webhooks
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "0"
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$REDIS_URL" ]; then
            echo "DATABASE_URL / REDIS_URL secrets are not set; nothing to replay."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: steps.config.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Replay
        if: steps.config.outputs.configured == 'true'
        run: |
          ARGS="--since-hours ${{ inputs.since_hours || '72' }} -v 2"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python manage.py replay_failed_webhooks $ARGS | tee -a "$GITHUB_STEP_SUMMARY"

x-app: &app
  build: .
  env_file: .env.example
  environment:
    DATABASE_URL: postgres://appconnect:appconnect@db:5432/appconnect
    REDIS_URL: redis://redis:6379/0
    OLLAMA_URL: http://ollama:11434
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appconnect
      POSTGRES_PASSWORD: appconnect
      POSTGRES_DB: appconnect
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appconnect"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi -b 0.0.0.0:8000 -w 3"
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: celery -A config worker -Q default,webhooks -l info --concurrency 4

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  ollama:
